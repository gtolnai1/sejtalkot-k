<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Állati sejt felépítése</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        
        .drag-item {
            cursor: grab;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.2s;
            touch-action: none;
        }
        .drag-item:active { cursor: grabbing; transform: scale(0.95); }
        .drag-item.correct {
            background-color: #10b981 !important; color: white !important; border-color: #059669 !important;
            pointer-events: none;
        }
        .drag-item.incorrect {
            background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        #image-container { position: relative; width: 100%; max-width: 800px; margin: 0 auto; }
        #image-container img { width: 100%; height: auto; display: block; }

        .drop-zone {
            position: absolute;
            width: 32px; height: 32px;
            margin-top: -16px; margin-left: -16px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            border: 2px dashed #4f46e5;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            transition: all 0.2s;
        }
        .drop-zone.drag-over { background-color: rgba(79, 70, 229, 0.4); transform: scale(1.2); }
        .drop-zone.filled { border: none; background: transparent; width: auto; height: auto; }

        /* Módosított célterületek */
        #zone-sejtmag { top: 52%; left: 56%; } /* Balra és lejjebb tolva a magvacskától */
        #zone-sejtmagvacska { top: 47%; left: 65%; width: 24px; height: 24px; margin-top: -12px; margin-left: -12px; border-color: #9333ea; } /* A sötét belső körön tartva */
        #zone-er { top: 35%; left: 62%; } /* Lejjebb hozva, közvetlenül a sejtmag fölé */
        
        /* További változatlan célterületek */
        #zone-golgi { top: 52%; left: 31%; }
        #zone-mitokondrium { top: 22%; left: 47%; }
        #zone-sejtközpont { top: 61%; left: 52%; }
        #zone-sejthartya { top: 80%; left: 20%; }
        #zone-lizoszoma { top: 17%; left: 57.5%; border-color: #ea580c; }
        #zone-peroxiszoma { top: 61%; left: 81.5%; border-color: #9333ea; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 flex justify-between items-center z-50">
        <div>
            <h1 class="text-xl font-bold">Állati sejt felépítése</h1>
            <p class="text-indigo-200 text-sm">Húzd a betűket a megfelelő sejtalkotókhoz!</p>
        </div>
        <div class="bg-indigo-800 rounded-lg px-4 py-2 shadow-inner">
            <span class="text-sm text-indigo-300">Pont:</span>
            <span id="score-display" class="font-bold text-lg ml-1">0 / 9</span>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-8 w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-1/3 flex flex-col gap-4">
            <div class="bg-white rounded-2xl shadow-sm p-5 border border-gray-100 flex-grow">
                <h3 class="font-semibold text-gray-700 mb-4 pb-2 border-b">Jelmagyarázat:</h3>
                <div id="source-zone" class="flex flex-col gap-3 min-h-[300px]">
                    <!-- JS tölti fel -->
                </div>
            </div>
        </div>

        <div class="w-full lg:w-2/3 bg-white rounded-2xl shadow-sm p-4 border border-gray-100 flex items-center justify-center">
            <div id="image-container">
                <img src="allati_sejt.png" alt="Állati sejt">
                
                <div id="zone-sejtmag" class="drop-zone" data-expected="sejtmag"></div>
                <div id="zone-sejtmagvacska" class="drop-zone" data-expected="sejtmagvacska"></div>
                <div id="zone-er" class="drop-zone" data-expected="er"></div>
                <div id="zone-golgi" class="drop-zone" data-expected="golgi"></div>
                <div id="zone-mitokondrium" class="drop-zone" data-expected="mitokondrium"></div>
                <div id="zone-sejtközpont" class="drop-zone" data-expected="sejtközpont"></div>
                <div id="zone-sejthartya" class="drop-zone" data-expected="sejthartya"></div>
                <div id="zone-lizoszoma" class="drop-zone" data-expected="lizoszoma"></div>
                <div id="zone-peroxiszoma" class="drop-zone" data-expected="peroxiszoma"></div>
            </div>
        </div>
    </main>

    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Tökéletes! 🎉</h2>
            <p class="text-gray-600 mb-6">Minden sejtalkotót sikeresen azonosítottál.</p>
            <p class="text-sm font-medium text-green-600 mb-8">(Az eredmény elmentve a Moodle naplóba!)</p>
            <button onclick="document.getElementById('success-modal').classList.add('hidden')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl">
                Bezárás
            </button>
        </div>
    </div>

    <script>
        let scormAPI = null;
        function findAPI(win) {
            let attempts = 0;
            while ((win.API == null) && (win.parent != null) && (win.parent != win)) {
                attempts++; if (attempts > 7) return null; win = win.parent;
            }
            return win.API;
        }
        function initSCORM() { scormAPI = findAPI(window); if (scormAPI) { try { scormAPI.LMSInitialize(""); } catch(e) {} } }
        function sendScore(currentScore, maxScore) {
            if (scormAPI) {
                try {
                    let pct = Math.round((currentScore / maxScore) * 100);
                    scormAPI.LMSSetValue("cmi.core.score.raw", String(pct));
                    scormAPI.LMSSetValue("cmi.core.lesson_status", "completed");
                    scormAPI.LMSCommit(""); scormAPI.LMSFinish("");
                } catch(e) { console.log("SCORM hiba:", e); }
            }
        }

        const organelles = [
            { id: "sejtmag", letter: "A", text: "Sejtmag" },
            { id: "sejtmagvacska", letter: "B", text: "Sejtmagvacska" },
            { id: "er", letter: "C", text: "Endoplazmatikus retikulum" },
            { id: "golgi", letter: "D", text: "Golgi-készülék" },
            { id: "mitokondrium", letter: "E", text: "Mitokondrium" },
            { id: "sejtközpont", letter: "F", text: "Sejtközpont" },
            { id: "sejthartya", letter: "G", text: "Sejthártya" },
            { id: "lizoszoma", letter: "H", text: "Lizoszóma" },
            { id: "peroxiszoma", letter: "I", text: "Peroxiszóma" }
        ];

        let score = 0;
        const totalScore = organelles.length;
        let draggedItem = null;
        let clone = null;
        let touchOffsetX = 0, touchOffsetY = 0;

        function initGame() {
            const sourceZone = document.getElementById('source-zone');
            
            [...organelles].sort(() => Math.random() - 0.5).forEach(org => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-4 bg-gray-50 border border-gray-200 rounded-xl p-2 shadow-sm transition-colors hover:bg-indigo-50';
                
                const el = document.createElement('div');
                el.className = 'drag-item flex-shrink-0 w-10 h-10 bg-white text-indigo-700 font-bold rounded-lg flex items-center justify-center border-2 border-indigo-300 hover:border-indigo-500 hover:shadow-md';
                el.draggable = true; 
                el.id = `item-${org.id}`; 
                el.dataset.answer = org.id;
                el.innerText = org.letter;
                
                const label = document.createElement('span');
                label.className = 'text-sm font-semibold text-gray-700';
                label.innerText = org.text;
                
                el.addEventListener('dragstart', function(e) {
                    draggedItem = this; e.dataTransfer.setData('text/plain', this.id);
                    setTimeout(() => this.classList.add('opacity-50'), 0);
                });
                el.addEventListener('dragend', function() {
                    this.classList.remove('opacity-50');
                    document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
                    draggedItem = null;
                });

                el.addEventListener('touchstart', handleTouchStart, {passive: false});
                el.addEventListener('touchmove', handleTouchMove, {passive: false});
                el.addEventListener('touchend', handleTouchEnd);

                row.appendChild(el);
                row.appendChild(label);
                sourceZone.appendChild(row);
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
                zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
                zone.addEventListener('drop', function(e) {
                    e.preventDefault(); this.classList.remove('drag-over');
                    const itemId = e.dataTransfer.getData('text/plain');
                    checkAnswer(document.getElementById(itemId), this);
                });
            });
        }

        function handleTouchStart(e) {
            if(this.classList.contains('correct')) return;
            e.preventDefault();
            draggedItem = this;
            const touch = e.touches[0];
            const rect = this.getBoundingClientRect();
            touchOffsetX = touch.clientX - rect.left;
            touchOffsetY = touch.clientY - rect.top;
            
            clone = this.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.left = `${rect.left}px`; clone.style.top = `${rect.top}px`;
            clone.style.width = `${rect.width}px`; clone.style.zIndex = '1000';
            clone.style.pointerEvents = 'none'; clone.style.opacity = '0.9';
            document.body.appendChild(clone);
            this.style.opacity = '0.3';
        }

        function handleTouchMove(e) {
            if (!clone) return;
            e.preventDefault();
            const touch = e.touches[0];
            clone.style.left = `${touch.clientX - touchOffsetX}px`;
            clone.style.top = `${touch.clientY - touchOffsetY}px`;
        }

        function handleTouchEnd(e) {
            if (!clone || !draggedItem) return;
            const touch = e.changedTouches[0];
            clone.style.display = 'none';
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            clone.style.display = 'block';
            
            const zone = elementBelow ? elementBelow.closest('.drop-zone') : null;
            if (zone) checkAnswer(draggedItem, zone);
            else errorAnim(draggedItem);

            draggedItem.style.opacity = '1';
            clone.remove(); clone = null; draggedItem = null;
        }

        function checkAnswer(item, zone) {
            if (!item || zone.classList.contains('filled')) return;
            if (item.dataset.answer === zone.dataset.expected) {
                item.classList.add('correct');
                item.draggable = false;
                zone.appendChild(item);
                zone.classList.add('filled');
                
                item.className = 'bg-green-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-lg absolute transform -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2';
                
                score++; document.getElementById('score-display').innerText = `${score} / ${totalScore}`;
                if (score === totalScore) {
                    document.getElementById('success-modal').classList.remove('hidden');
                    sendScore(score, totalScore);
                }
            } else {
                errorAnim(item);
            }
        }

        function errorAnim(item) {
            item.classList.add('incorrect');
            setTimeout(() => item.classList.remove('incorrect'), 500);
        }

        window.onload = () => { initSCORM(); initGame(); };
    </script>
</body>
</html>
